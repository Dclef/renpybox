<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>更新 RenpyBox</title>
    <link rel="stylesheet" href="./update-dialog.css" />
    <script src="./update-dialog.js" defer></script>
  </head>
  <body>
    <section class="dialog">
      <h1>RenpyBox 桌面更新</h1>
      <p class="ver">当前 <span id="from">—</span><span id="target" hidden> → <span id="to" class="accent">—</span></span></p>
      <progress id="progress" class="bar" max="100" value="0" aria-label="更新下载进度" hidden></progress>
      <p id="status" class="pct" role="status">读取更新状态…</p>
      <p id="error" class="error" role="alert" hidden></p>
      <p class="note">从 GitHub 检查桌面版更新。下载完成后可重启安装。</p>
      <section id="install-confirm" class="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-description">
        <h2 id="confirm-title">重启并安装更新？</h2>
        <p id="confirm-description">请先保存工作，并等待正在运行的任务完成。安装会关闭并重启 RenpyBox。</p>
        <div class="actions">
          <button id="confirm-cancel" type="button">取消</button>
          <button id="confirm-install" type="button" class="primary">重启并安装</button>
        </div>
      </section>
      <footer>
        <button id="details" type="button" hidden>发布详情</button>
        <button id="later" type="button">关闭</button>
        <button id="now" type="button" class="primary" disabled>检查更新</button>
      </footer>
    </section>
  </body>
</html>
