name: RenpyBox desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this desktop build to GitHub Releases
        required: true
        default: false
        type: boolean
  push:
    branches:
      - new_UI
    paths:
      - "desktop/**"
      - "api/**"
      - "base/**"
      - "module/**"
      - "resource/**"
      - "utils/**"
      - "update_integrity.py"
      - "update_path_policy.py"
      - "CHANGELOG.md"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/new_UI'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for the bundled backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            desktop/scripts/requirements-backend.txt
            desktop/sidecar/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/scripts/requirements-backend.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop

      - name: Check renderer types
        run: npm run typecheck --prefix desktop

      - name: Check desktop contracts
        run: |
          $testFiles = Get-ChildItem desktop/tests -Filter '*.test.mjs' -File | ForEach-Object FullName
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        run: npm run pack:win --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check desktop windows, font lifecycle and toolbox
        working-directory: desktop
        run: |
          $env:ELECTRON_RUN_AS_NODE = $null
          & .\node_modules\.bin\electron.cmd scripts/check-window-close.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd scripts/check-window-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd scripts/check-font-parity.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd scripts/check-desktop-dialogs.cjs --workflows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd scripts/check-toolbox-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: renpybox-newui-windows
          path: |
            desktop/release/RenpyBox-NewUI-*-x64.exe
            desktop/release/RenpyBox-NewUI-*-x64.zip
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/new_UI'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: renpybox-newui-windows
          path: desktop/release
      - name: Publish desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 客户端直接查 GitHub Releases API（desktop/main/updater.js），只用安装包资产，
          # 因此这里只上传 exe 与 zip，不再产生 blockmap / newui.yml。
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+(-newui[.][0-9]+)?$') { throw 'Expected a desktop release version' }
          $files = @(
            "desktop/release/RenpyBox-NewUI-$version-x64.exe",
            "desktop/release/RenpyBox-NewUI-$version-x64.zip"
          )
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file)) { throw "Missing artifact: $file" } }
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, ('(?ms)^## v' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'))
          if (!$section.Success) { throw "Missing changelog for v$version" }
          $notesPath = Join-Path $env:RUNNER_TEMP 'desktop-release-notes.md'
          $section.Groups[1].Value.Trim() | Set-Content -LiteralPath $notesPath -Encoding utf8
          # Qt 客户端读取 /releases/latest 并期待 RenpyBox_v*.zip；桌面版自行扫描 release 列表。
          $releaseFlags = if ($version -match '-newui[.]') { @('--prerelease', '--latest=false') } else { @('--latest=false') }
          gh release create "v$version" @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA @releaseFlags --title "RenpyBox $version" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
