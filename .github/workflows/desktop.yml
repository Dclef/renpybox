name: RenpyBox desktop

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "desktop/**"
      - "api/**"
      - "base/**"
      - "module/**"
      - "resource/**"
      - "utils/**"
      - "update_integrity.py"
      - "update_path_policy.py"
      - "CHANGELOG.md"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for the bundled backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            desktop/scripts/requirements-backend.txt
            desktop/sidecar/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/scripts/requirements-backend.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop

      - name: Check renderer types
        run: npm run typecheck --prefix desktop

      - name: Check desktop contracts
        run: npm test --prefix desktop

      - name: Build Windows installer
        run: npm run pack:win --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 全量包内嵌清单：更新器记录安装态版本与文件哈希，仅此用途；失败只告警不阻塞发布。
      - name: Embed update manifest into the portable zip
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          try {
            python buildtools/update_assets.py manifest --dist desktop/release/win-unpacked --version $version --zip "desktop/release/RenpyBox-$version-x64.zip"
            if ($LASTEXITCODE -ne 0) { throw "清单写入失败，退出码 $LASTEXITCODE" }
          } catch {
            Write-Host "::warning::$($_.Exception.Message)"
            exit 0
          }

      - name: Check desktop windows, font lifecycle and toolbox
        working-directory: desktop
        run: |
          $env:ELECTRON_RUN_AS_NODE = $null
          npm run check:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: renpybox-windows
          path: |
            desktop/release/RenpyBox-*-x64.exe
            desktop/release/RenpyBox-*-x64.zip
          if-no-files-found: warn
