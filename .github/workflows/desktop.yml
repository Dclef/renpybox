name: RenpyBox desktop

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - new_UI
    paths:
      - "desktop/**"
      - "api/**"
      - "base/**"
      - "module/**"
      - "resource/**"
      - "utils/**"
      - "update_integrity.py"
      - "update_path_policy.py"
      - "CHANGELOG.md"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/new_UI' || github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for the bundled backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            desktop/scripts/requirements-backend.txt
            desktop/sidecar/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/scripts/requirements-backend.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop

      - name: Check renderer types
        run: npm run typecheck --prefix desktop

      - name: Check desktop contracts
        run: npm test --prefix desktop

      - name: Build Windows installer
        run: npm run pack:win --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check desktop windows, font lifecycle and toolbox
        working-directory: desktop
        run: |
          $env:ELECTRON_RUN_AS_NODE = $null
          npm run check:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: renpybox-newui-windows
          path: |
            desktop/release/RenpyBox-NewUI-*-x64.exe
            desktop/release/RenpyBox-NewUI-*-x64.zip
          if-no-files-found: error
