name: Prepare RenpyBox release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "api/**"
      - "base/**"
      - "module/**"
      - "resource/**"
      - "utils/**"
      - "buildtools/**"
      - "*.py"
      - "requirements.txt"
      - "version.txt"
      - "CHANGELOG.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop.yml
  draft:
    needs: [desktop]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: renpybox-windows
          merge-multiple: true
          path: release-assets
      - name: Verify complete release and prepare draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Expected a stable desktop version' }
          if ((Get-Content version.txt -Raw).Trim() -ne "v$version") { throw 'version.txt and application versions differ' }
          # 安装包与全量 zip 必须各正好一个，不接受"至少一个"，也不额外收集其他资产。
          $installers = @(Get-ChildItem -Path release-assets -Filter "RenpyBox-$version-x64.exe" -File -ErrorAction SilentlyContinue)
          $portableZips = @(Get-ChildItem -Path release-assets -Filter "RenpyBox-$version-x64.zip" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer for v$version, found $($installers.Count)" }
          if ($portableZips.Count -ne 1) { throw "Expected exactly one portable zip for v$version, found $($portableZips.Count)" }
          foreach ($required in @($installers[0], $portableZips[0])) {
            if ($required.Length -eq 0) { throw "Missing artifact: release-assets/$($required.Name)" }
          }
          $files = @($installers[0].FullName, $portableZips[0].FullName)
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, ('(?ms)^## v' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'))
          if (!$section.Success) { throw "Missing changelog for v$version" }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $bullets = @($section.Groups[1].Value -split '\r?\n' | Where-Object { $_ -match '^- ' })
          if ($bullets.Count -eq 0) { throw "Missing release notes for v$version" }
          $releaseDate = [regex]::Match($section.Value, '^## v[^\r\n]*?(\d{4}-\d{2}-\d{2})').Groups[1].Value
          if (!$releaseDate) { throw 'Missing release date in changelog heading' }
          $notes = "更新日志：`n$releaseDate v${version}：`n`n" + ($bullets -join "`n")
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          # 桌面客户端按 vX.Y.Z 识别版本。
          $tag = "v$version"
          $existingJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$existing.isDraft) {
              Write-Host "::notice::Release $tag is already published; skipping replacement. Bump the application version before publishing new artifacts."
              exit 0
            }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "RenpyBox $version" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "RenpyBox $version" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
