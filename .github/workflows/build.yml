name: RenpyBox build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "base/Version.py"
      - "version.txt"
      - "main.spec"
      - "build.bat"
      - ".github/workflows/build.yml"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Version
        id: check_version
        shell: pwsh
        run: |
          $version = python -c "from base.Version import Version; print(Version.CURRENT)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Requirements
        shell: cmd
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt
          python -m pip cache purge

      - name: Build EXE (build.bat)
        shell: cmd
        run: call build.bat

      - name: Compress Archive
        shell: cmd
        run: .\resource\7za.exe a -y -bt -mx5 RenpyBox_${{ steps.check_version.outputs.version }}.zip .\dist\RenpyBox\*

      - name: Embed Update Manifest
        shell: cmd
        run: python buildtools\update_assets.py manifest --dist dist\RenpyBox --version ${{ steps.check_version.outputs.version }} --zip RenpyBox_${{ steps.check_version.outputs.version }}.zip

      - name: Generate Incremental Patch
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.check_version.outputs.version }}"
          $tag = "RenpyBox_$version"
          $releases = gh api /repos/dclef/RenpyBox/releases --paginate --jq `
            ".[] | select(.draft == false) | select(.tag_name != `"$tag`")" | ConvertFrom-Json
          $prev = $releases | Select-Object -First 1
          if ($null -eq $prev) {
            Write-Host "No previous release found, skip patch generation"
            exit 0
          }
          $prevTag = $prev.tag_name
          $prevZip = $prev.assets | Where-Object { $_.name -like "*.zip" -and $_.name -notlike "*.patch.zip" } | Select-Object -First 1
          if ($null -eq $prevZip) {
            Write-Host "Previous release has no full zip, skip patch generation"
            exit 0
          }
          Invoke-WebRequest -Uri $prevZip.browser_download_url -OutFile prev_release.zip
          python buildtools\update_assets.py patch `
            --dist dist\RenpyBox `
            --version $version `
            --prev-zip prev_release.zip `
            --prev-version $prevTag `
            --out "RenpyBox_$version.from-$prevTag.patch.zip"

      - name: Collect Release Files
        id: release_files
        shell: pwsh
        run: |
          $version = "${{ steps.check_version.outputs.version }}"
          $files = @("RenpyBox_$version.zip")
          $patch = Get-ChildItem -Filter "RenpyBox_$version.from-*.patch.zip" -ErrorAction SilentlyContinue
          if ($patch) { $files += $patch.Name }
          "files=$($files -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: RenpyBox_${{ steps.check_version.outputs.version }}
          name: RenpyBox_${{ steps.check_version.outputs.version }}
          draft: true
          prerelease: false
          files: ${{ steps.release_files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
