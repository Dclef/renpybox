name: RenpyBox Python compatibility build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check Version
        id: check_version
        shell: pwsh
        run: |
          $version = python -c "from base.Version import Version; print(Version.CURRENT)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Expected a stable Python compatibility version' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Requirements
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Python migration and update dialogs
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/base/test_version_manager.py tests/base/test_desktop_migration.py tests/frontend/test_desktop_migration_ui.py tests/frontend/test_app_update_ui.py tests/frontend/setting/test_update_dialogs.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Python EXE
        shell: cmd
        run: call build.bat

      - name: Verify frozen migration dialog
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $probeDirectory = Join-Path $env:RUNNER_TEMP 'renpybox-qt-smoke'
          New-Item -ItemType Directory -Path $probeDirectory -Force | Out-Null
          $process = Start-Process -FilePath (Resolve-Path dist/RenpyBox/RenpyBox.exe) -ArgumentList '--self-test' -WorkingDirectory $probeDirectory -NoNewWindow -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Frozen migration self-test timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen migration self-test failed: $($process.ExitCode)" }

      - name: Compress compatibility archive
        shell: pwsh
        run: |
          if (!(Test-Path dist/RenpyBox/RenpyBox.exe)) { throw 'Missing Python compatibility executable' }
          & .\resource\7za.exe a -y -bt -mx5 -mcu=on "RenpyBox_${{ steps.check_version.outputs.version }}.zip" .\dist\RenpyBox\*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python buildtools/update_assets.py manifest --dist dist/RenpyBox --version '${{ steps.check_version.outputs.version }}' --zip 'RenpyBox_${{ steps.check_version.outputs.version }}.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\resource\7za.exe t "RenpyBox_${{ steps.check_version.outputs.version }}.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Python compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: renpybox-python-windows
          path: RenpyBox_${{ steps.check_version.outputs.version }}.zip
          if-no-files-found: error
