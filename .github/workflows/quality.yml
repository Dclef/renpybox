name: RenpyBox quality

# 质量门禁：pytest 全量 + ruff 错误级 + 语法冒烟。
# dev 推送与 PR 独立运行；发布流程通过 workflow_call 复用本文件（见 build.yml 的 needs）。
on:
  workflow_call:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Requirements
        shell: cmd
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Syntax Smoke (compileall)
        shell: cmd
        run: python -m compileall -q base module frontend widget app.py updater.py

      - name: Lint (ruff E9+F)
        shell: cmd
        run: python -m ruff check .

      - name: Tests (pytest)
        shell: cmd
        timeout-minutes: 30
        run: python -m pytest -q -m "not slow"
